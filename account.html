<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F1E7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="French Habit Tracker">
  <title>Account | French Habit Tracker</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="microcopy">Compte</div>
      <h1>Account</h1>
      <p class="subtitle">Manage your sign-in and keep your French practice private.</p>

      <div class="account-summary account-page-summary">
        <div class="account-avatar" id="accountInitial" aria-hidden="true">F</div>
        <div class="account-copy">
          <span>Signed in as</span>
          <strong id="accountEmail">Checking session...</strong>
          <p id="accountHint">Cloud sync is tied to this email.</p>
        </div>
      </div>

      <form class="auth-form" id="passwordForm" novalidate>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat new password" required>
        </div>
        <button class="primary-btn" id="updatePasswordBtn" type="submit">Update password</button>
        <p class="feedback" id="accountFeedback" aria-live="polite"></p>
      </form>

      <div class="account-page-actions">
        <a class="secondary-btn account-nav-btn" href="index.html">Back to tracker</a>
        <button class="danger-btn" id="signOutBtn" type="button">Sign out</button>
      </div>
    </section>
  </main>

  <script src="js/cloud-config.js"></script>
  <script src="js/account.js" defer></script>
</body>
</html>
